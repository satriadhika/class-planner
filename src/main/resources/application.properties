spring.application.name=class-planner
server.port=8080
server.servlet.context-path=/api/v1

# ===== Database =====
spring.datasource.url=jdbc:postgresql://localhost:5432/classPlanner
spring.datasource.username=${DB_USERNAME:admCP}
spring.datasource.password=${DB_PASSWORD:Adhika10}
spring.datasource.hikari.maximum-pool-size=10

# ===== JPA / Hibernate =====
# Schema diatur Flyway, Hibernate hanya validasi
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Upload file (nilai & asesmen) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Error format (Problem Details / RFC 9457) =====
spring.mvc.problemdetails.enabled=true

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:u30vDyC9+vsgwFIvCaaJDvchggHCqeJ1C+3EYwwBPs4=}
app.jwt.expiration-seconds=3600


# ===== Logging =====
logging.level.root=INFO
logging.level.com.satria=DEBUG

